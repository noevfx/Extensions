name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar pacotes
        run: python tools/build.py

      - name: Preparar notas e hashes dos dois produtos
        id: release
        run: python tools/release_notes.py

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          body_path: dist/RELEASE-${{ steps.release.outputs.version }}.md
          files: |
            dist/NoeVFX-Downloader-${{ steps.release.outputs.version }}.zip
            dist/NoeVFX-Downloader-for-Editors-${{ steps.release.outputs.version }}.zip
            dist/SHA256-${{ steps.release.outputs.version }}.txt
