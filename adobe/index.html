<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Noe VFX for Editors</title>
<style>
  :root { --bg:#1e1f22; --card:#26282c; --line:#34373d; --text:#e8eaee; --muted:#8e939c; --accent:#0066ff; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font: 12px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { display:flex; flex-direction:column; padding:10px; gap:9px; overflow:hidden; }
  header { display:flex; align-items:center; gap:8px; }
  header svg { flex-shrink:0; }
  header b { font-size:13px; }
  .pill { font-size:9px; font-weight:800; letter-spacing:.6px; padding:2px 6px; border-radius:99px; background:rgba(0,102,255,.18); color:#7fb0ff; border:1px solid rgba(0,102,255,.45); }
  .info { padding:7px 9px; border-radius:8px; background:var(--card); border:1px solid var(--line); font-size:11px; line-height:1.45; word-break:break-word; }
  .info.ok { border-color:rgba(34,197,94,.45); }
  .info.warn { border-color:rgba(245,158,11,.55); color:#f6d38b; }
  .info.err { border-color:rgba(239,68,68,.55); color:#f3a4a4; }
  .info b { color:var(--text); }
  label.h { font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
  textarea { width:100%; min-height:86px; max-height:200px; resize:vertical; padding:8px; border-radius:8px; border:1px solid var(--line); background:#17181b; color:var(--text); font:11px/1.45 Consolas, monospace; outline:none; }
  textarea:focus { border-color:var(--accent); }
  .row { display:flex; gap:6px; align-items:center; }
  select { flex:1; min-width:0; padding:7px; border-radius:8px; border:1px solid var(--line); background:#17181b; color:var(--text); font-size:11.5px; }
  button.go { flex:1.4; min-width:0; padding:8px 10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button.go:hover { background:#0052cc; }
  button.go:disabled { opacity:.5; cursor:default; }
  .list { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:5px; }
  .it { padding:7px 9px; border-radius:8px; background:var(--card); border:1px solid var(--line); }
  .it .u { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .s { font-size:11.5px; margin-top:2px; }
  .it.ok .s { color:var(--ok); } .it.err .s { color:var(--err); }
  .bar { height:3px; margin-top:5px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  footer { font-size:10px; color:var(--muted); display:flex; justify-content:space-between; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 722.36 722.36" width="22" height="22"><rect fill="#0066FF" width="722.36" height="722.36" rx="102.3"/><path fill="#fff" d="M550.64,561.37H168.59c-4.19,0-7.59-3.4-7.59-7.59V171.73l389.63,389.63ZM553.77,161H171.72l389.63,389.63V168.58c0-4.17-3.39-7.59-7.59-7.59Z"/></svg>
    <b>Noe VFX</b><span class="pill">EDITORS</span>
  </header>

  <div id="info" class="info">Verificando o projeto...</div>

  <label class="h" for="links">Links (um por linha)</label>
  <textarea id="links" spellcheck="false" placeholder="https://www.instagram.com/p/...&#10;https://www.youtube.com/watch?v=..."></textarea>
  <div class="row">
    <select id="quality" title="Qualidade">
      <option value="best">Qualidade nativa</option>
      <option value="1080">Até 1080p</option>
      <option value="720">Até 720p</option>
    </select>
    <button class="go" id="go" type="button">Baixar e importar</button>
  </div>

  <div class="list" id="list"></div>
  <footer><span id="app">App local: ...</span><span>H.264 + bin _Noe VFX Downloader</span></footer>

<script src="js/core.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
