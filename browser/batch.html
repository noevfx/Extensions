<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noe VFX - vários links</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#262b38; --text:#eef1f7; --muted:#8a93a6; --accent:#0066ff; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; align-items:center; gap:10px; }
  header b { font-size:17px; }
  .pill { font-size:9.5px; font-weight:800; letter-spacing:.6px; padding:2px 7px; border-radius:99px; background:rgba(0,102,255,.18); color:#7fb0ff; border:1px solid rgba(0,102,255,.45); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .h { font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
  textarea { width:100%; min-height:150px; resize:vertical; padding:10px; border-radius:9px; border:1px solid var(--line); background:#0c0e14; color:var(--text); font:12px/1.5 Consolas, monospace; outline:none; }
  textarea:focus, select:focus { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  select { width:100%; padding:9px; border-radius:9px; border:1px solid var(--line); background:#0c0e14; color:var(--text); font-size:12.5px; }
  .dest { font-size:11.5px; color:var(--muted); word-break:break-all; }
  .dest b { color:var(--text); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  label.chk { display:flex; gap:8px; align-items:flex-start; font-size:12px; cursor:pointer; }
  label.chk input { accent-color:var(--accent); margin-top:2px; }
  label.chk small { display:block; color:var(--muted); font-size:11px; }
  button { font:inherit; cursor:pointer; border-radius:9px; }
  button.go { padding:11px 18px; border:0; background:var(--accent); color:#fff; font-weight:700; font-size:13.5px; }
  button.go:hover { background:#0052cc; }
  button.go:disabled { opacity:.5; cursor:default; }
  button.ghost { padding:8px 12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:12px; }
  .msg { font-size:12px; color:var(--muted); }
  .msg.err { color:#f3a4a4; } .msg.warn { color:#f6d38b; }
  .list { display:flex; flex-direction:column; gap:6px; }
  .it { padding:9px 11px; border-radius:9px; background:var(--card); border:1px solid var(--line); }
  .it .u { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .s { margin-top:2px; font-size:12.5px; }
  .it.ok .s { color:var(--ok); } .it.err .s { color:var(--err); }
  .bar { height:3px; margin-top:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 722.36 722.36" width="26" height="26"><rect fill="#0066FF" width="722.36" height="722.36" rx="102.3"/><path fill="#fff" d="M550.64,561.37H168.59c-4.19,0-7.59-3.4-7.59-7.59V171.73l389.63,389.63ZM553.77,161H171.72l389.63,389.63V168.58c0-4.17-3.39-7.59-7.59-7.59Z"/></svg>
    <b data-i18n="batchTitle"></b><span class="pill" id="edPill" hidden>EDITORS</span>
  </header>

  <div class="card">
    <div class="h" data-i18n="batchLinks"></div>
    <textarea id="links" spellcheck="false" placeholder="https://www.instagram.com/p/...&#10;https://www.youtube.com/watch?v=..."></textarea>
    <div class="grid">
      <div>
        <div class="h" data-i18n="batchQuality"></div>
        <select id="quality">
          <option value="best" data-i18n="qBest"></option>
          <option value="1080" data-i18n="q1080"></option>
          <option value="720" data-i18n="q720"></option>
          <option value="audio" data-i18n="qAudio2"></option>
        </select>
      </div>
      <div>
        <div class="h" data-i18n="batchDest"></div>
        <select id="dest">
          <option value="default" data-i18n="batchDestDefault"></option>
          <option value="custom" data-i18n="batchDestCustom"></option>
          <option value="premiere" data-i18n="batchDestPr" data-adobe></option>
          <option value="aftereffects" data-i18n="batchDestAe" data-adobe></option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="dest" id="destInfo"></div>
      <button class="ghost" id="pick" type="button" hidden data-i18n="batchPick"></button>
    </div>
    <label class="chk" id="compatRow"><input type="checkbox" id="compat"><span><b data-i18n="compatShort"></b><small data-i18n="batchCompatHint"></small></span></label>
    <div class="row">
      <button class="go" id="go" type="button" data-i18n="batchGo"></button>
      <span class="msg" id="msg"></span>
    </div>
  </div>

  <div class="list" id="list"></div>
</main>
<script src="edition.js"></script>
<script src="i18n.js"></script>
<script src="batch.js"></script>
</body>
</html>
